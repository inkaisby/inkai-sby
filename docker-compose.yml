services:
  postgres:
    image: postgres:16-alpine
    container_name: inkai-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: inkai
      POSTGRES_PASSWORD: inkai
      POSTGRES_DB: inkai_local
    ports:
      - "5433:5432"
    volumes:
      - inkai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkai -d inkai_local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  inkai_pgdata:
